<!doctype html>
<!--
  Renders the extension's toolbar icons from the brand mark (public/brand/Icon.svg).
  Regenerate with:  bash scripts/ext-icons.sh
-->
<meta charset="utf-8" />
<body>
<script>
  // The mark's outline (body with the eye cut out) and the eye alone, in the SVG's own coordinates.
  const BODY =
    "M486.279 1940.47C477.053 1939.73 467.531 1940.79 458.195 1943.88 420.85 1956.26 400.62 1996.53 413.011 2033.82 425.402 2071.12 465.721 2091.33 503.066 2078.95 540.412 2066.58 560.641 2026.31 548.25 1989.01 538.957 1961.03 513.954 1942.68 486.279 1940.47ZM24.6896 1794 407.248 1794C516.84 1794 608.277 1871.64 629.424 1974.85L633.114 2011.42 652.061 2011.42C717.197 2011.42 770 2064.15 770 2129.21L770 2224.12C770 2236.76 759.745 2247 747.094 2247L407.248 2247C281.999 2247 180.464 2145.59 180.464 2020.5L180.464 2000.97 146.403 2000.97C117.791 2000.97 94.5954 1977.81 94.5954 1949.23L94.5954 1897.49 60.808 1897.49C32.1951 1897.49 8.99993 1874.32 8.99993 1845.74L8.99993 1809.67C8.99993 1801.02 16.0243 1794 24.6896 1794Z";
  const EYE = BODY.slice(0, BODY.indexOf("Z") + 1);

  // active: the glowing bird (Corvus is capturing this tab right now).
  // remembered: this site is remembered. unremembered: Corvus isn't saving this page.
  // paused: capture is paused. disconnected: not connected to Corvus.
  const STATES = {
    active: { body: "#ffffff", eye: "#9570ff", glow: "rgba(149, 112, 255, 0.95)" },
    remembered: { body: "#9570ff", eye: "#ffffff" },
    unremembered: { body: "#9a93a6", eye: null },
    paused: { body: "#9a93a6", eye: "#e3a54a" },
    disconnected: { body: "#6b6475", eye: "#ef5b6b", alpha: 0.85 },
  };
  const SIZES = [16, 32, 48, 128];

  function draw(state, size) {
    const s = STATES[state];
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const ctx = c.getContext("2d");
    const fill = s.glow ? (size <= 32 ? 0.9 : 0.8) : 0.98; // leave room for the glow
    const scale = (size * fill) / 761;
    ctx.translate((size - 761 * scale) / 2, (size - 453 * scale) / 2 + size * 0.02);
    ctx.scale(scale, scale);
    ctx.translate(-9, -1794);
    ctx.globalAlpha = s.alpha ?? 1;
    const body = new Path2D(BODY);
    if (s.glow) {
      ctx.save();
      ctx.shadowColor = s.glow;
      ctx.shadowBlur = size * 0.16;
      ctx.fillStyle = s.body;
      for (let i = 0; i < (size <= 16 ? 1 : 2); i++) ctx.fill(body, "evenodd");
      ctx.restore();
    }
    ctx.fillStyle = s.body;
    ctx.fill(body, "evenodd");
    if (s.eye) {
      ctx.fillStyle = s.eye;
      ctx.fill(new Path2D(EYE));
    }
    return c.toDataURL("image/png");
  }

  const out = [];
  for (const state of Object.keys(STATES)) for (const size of SIZES) out.push(`${state}-${size} ${draw(state, size)}`);
  document.body.textContent = `BEGIN\n${out.join("\n")}\nEND`;
</script>
</body>
